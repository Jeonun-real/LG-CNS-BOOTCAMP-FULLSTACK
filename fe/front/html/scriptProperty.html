<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="../css/coffee.css" rel="stylesheet">
    </head>
    <body>
        <div>
            <h1>inspire Coffee</h1>
            <img src="../img/coffee-blue.jpg" width="200" height="200">

        </div>

        <div>
            <!-- toggle버튼 -->
            <!-- <button type="button" onclick="handler('lgcns coffee','coffee-pink.jpg')">해당 이미지의 속성을 변경</button> -->
            <button type="button" id="btn">inspire Coffee</button>
        </div>

        <script>
            /*
                step1. 버튼의 이벤트를 감지하는 함수 정의
                step2. 이벤트 발생시 h1과 img 태그에 접근하여 
                step3. 이미지 src 속성에 접근하여 coffee-pink-jpg 변경
                step4. h1 접근해서 text를 lg cns 컼피로 변경
                필요에 따라서 태그에 선택자를 정의할 수 있음.
                step5. 텟그트 완료되면 ai agent 도움으로 css 작성하고 꾸미기
            
            */
            // document.querySelector("#btn").addEventListener('click',()=>{
            //     console.log('클릭');
            //     const h1 = document.querySelector("h1");
            //     console.log("h1",h1);
            //     h1.textContent = "lg_cns"
            //     const img = document.querySelector("img");
            //     console.log("img",img);
                
            // })
            
            document.querySelector('#btn').onclick = (e) =>{
                console.log("btn",e.target.textContent);
                if(e.target.textContent ==='inspire Coffee'){
                    let h1 = document.querySelector('body>div>h1');
                    console.log(h1);
                    let img = document.querySelector('body>div>img');
                    console.log(img);
                    h1.textContent="LGcns Coffee";
                    img.src = '../img/coffee-pink.jpg';
                    e.target.textContent = "LGcns Coffee"

                }
                else{
                    let h1 = document.querySelector('body>div>h1');
                    console.log(h1);
                    let img = document.querySelector('body>div>img');
                    console.log(img);
                    h1.textContent="inspire Coffee";
                    img.src = '../img/coffee-blue.jpg';
                    e.target.textContent = "inspire Coffee"
                }
            }

        </script>


    </body>
</html>
