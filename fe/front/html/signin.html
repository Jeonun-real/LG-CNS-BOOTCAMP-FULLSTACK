<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Document</title>
        <!-- CDN 인터넷이 연결된 상태에서 사용자와 가까운 서버에서 css나 js를 가져다 쓸수 있게 해줌 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    </head>
    <body>
        <!-- form의 name(데이터)를 종합하여 헤당링크에 전달 -->
        <form action="/server-destination" method="get">
            <div class="mb-3 mt-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
            </div>
            <div class="mb-3">
                <label for="pwd" class="form-label">Password:</label>
                <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
            </div>
            <div class="form-check mb-3">
                <label class="form-check-label">
                    <input class="form-check-input" type="checkbox" name="remember"> Remember me
                </label>
            </div>
            <button type="button" class="btn btn-danger" id="submit">Submit</button>
        </form>

        <script>
            // #은 document 영역에서 id 찾기 가능
            // #에 있는 id에서 사용자 action이 들어오면 fuction 시행
            document.querySelector("#submit").onclick = function() {
                window.alert(">>> submit button click");
                let email = document.querySelector("#email").value;
                let pwd = document.querySelector("#pwd").value;
                console.log(`debug >>>> ${email}`);
                console.log(`debug >>>> ${pwd}`);            
                }     

        </script>

    </body>
</html>
