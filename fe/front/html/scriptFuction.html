           /*
           Q1)
           - email의 값을 키로하고 nickname 값을 값으로 하는 새로운 객체를 만들려고 한다.
           - 즉 배열을 가공하여 하나의 객체로 합치는 것
           - array : reduce(acc,cur,idx,ary) 함수
           - acc는 새로 누적, cur 현재 배열 처리, idx 현재 인덱스, ary 원본 배열
           */
           const userAry= [
                {email:'naver.com',nickName:'Ironman'},
                {email:'google.com',nickName:'Bob'},
                {email:'daum.com',nickName:'Alice'}
           ];

           const reduceAry=userAry.reduce((obj,cur)=>{
                obj[cur.email] = cur.nickName;
                return obj;
           },{});


           console.log(reduceAry);
