<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>script</title>
    </head>

    <body>
        <script>
            /*
            script(interpreter)
            변수 - 데이터를 담는 그릇
            - 변수의 타입이 존재하지 않는다(es6 var, let, const).(type script를 쓰면 변수의 타입 사용 가능)
            - 실행시점(변수에 값이 할당되는 시점)에 변수의 타입이 묵시적으로 할당
            - 기본타입(숫자, 문자(열), 논리, null, undefined)
            - 참조타입(object, array, fuction, etc.....) -> object
            - 흐름제어구문, 반복구문
            - 함수(function)
            */
            var message = "script";
            console.log(`debug>>>message = ${message}`);
            console.log(`debug>>>message = ${typeof message}`);
            var message = 10;
            console.log(`debug>>>message = ${message}`);
            console.log(`debug>>>message = ${typeof message}`);
            console.log(`debug>>>message = ${message == "10"}`);
            console.log(`debug>>>message = ${message === "10"}`);

            // var message = "message"
            let msg = "let 키워드를 이용하면 중복 변수 선언 방지 가능";
            console.log(`debug>>>const는 상수 재할당 불가`);
            const num = 10;
            // num = 20;

            console.log(`debug>>> 스트립트에서 가장 많이 사용하는 변수의 타입 - object`);
            let obj= { 
                neme : "jslim",
                age : 20,
                major :"cs"
            };
            console.log("debug>>> obj value" , obj);
            console.log("debug>>> obj type" , typeof obj);
            console.log("debug>>> obj property" , obj.major);
            console.log("debug>>> obj property" , obj['major']);
            console.log(`debug>>> 스트립트 객체를 담는 변수의 타입 [] - array`);
            let ary =[
                {name:"inspire"},
                {name:"igcns"},
                {name:"am"},
                {name:"camp6th"}
            ];
            console.log("debug>>> array value" , ary);
            console.log(`debug>>> array value ${ary}`);
            console.log("debug>>> array type" , typeof ary);
            console.log("debug>>> array index" , ary[0].name);
            console.log(`debug>>> array index ${ary[3].name}`);
           


        </script>
    </body>
</html>
