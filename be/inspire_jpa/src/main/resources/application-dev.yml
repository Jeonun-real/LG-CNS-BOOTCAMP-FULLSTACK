server:
  port: 8000


spring:
  application:
    name: inspire_jpa

  # spring mvc view path 
  # mvc:
  #   view:
  #     prefix: /WEB-INF/view/
  #     suffix: .jsp

  config:
    activate:
      on-profile: dev
    

  # mariadb settingh
  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}


  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/mariadb

  # jpa
  jpa:
    hibernate:
      # dto X, entity(table) -> auto generator(table)
      # create, create-drop, update, none
      # flyway : 
      # - 로컬 개발 초기              update(미적용)
      # - 로컬/스테이징 안정화 이후     validate(적용)
      # - 운영                       validate or none(적용)     

      ddl-auto: none

    # 콘솔출력
    show-sql: true 
    properties:
      hibernate:
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

        # example(h2)
        # h2
        # dialect: org.hibernate.dialect.H2Dialect 

        # mariadb
        dialect: org.hibernate.dialect.MariaDBDialect 
        format_sql: true 
  # redis
  # docker : image(docker hub) <- contariner 실행
  # docker run -d --name redis-contiainer -p 6379:6379 redis:7.2
  # docker exec -it --name redis-contiainer redis-cli 

  # docker run -d --name redis-insight -p 8001:5540 redis/redisinsight:latest
  # http://localhost:8001
  # host: host.docker.internal, redis

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 6000ms

  ai:
    openai:
      api-key: ${OPEN_AI_KEY}
      chat:
        options:
          model: ${OPEN_AI_MODEL}

# mybatis:
#   mapper-locations: classpath:/mappers/**/*Mapper.xml
  # type-aliases-package: com.example.testcase


jwt:
  secret: ${JWT_SECRET_KEY}


#OPENAPI
openapi:
  serviceKey: ${OPENAPI_SERVICE_KEY}
  callBackUrl: ${OPENAPI_CALLBACKURL}
  datatype: ${OPENAPI_TYPE}

